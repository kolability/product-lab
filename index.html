<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Dashboard</title>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main class="container">
      
      <article class="card">
        <div class="icon">
        ₦
        </div>
        
        <h3>Total Fuel Spend</h3>
        <p class="amount">
          ₦2,450,000
        </p>
        <div class="growth">
          <span class="percentage">↑ 5%</span>
          <p>vs last month</p>
        </div>
      </article>

      <article class="card">
        <div class="icon">
        ⛽️
        </div>
        
        <h3>Total Fuel Consumed</h3>
        <p class="liters">
          18,450 liters
        </p>
        <div class="growth">
          <span class="percentage">↓ 4.2%</span>
          <p>vs last month</p>
        </div>
    </article> 
    <article class="card">
        <div class="icon">
        ⛽️
        </div>
        
        <h3>Total Fuel Consumed</h3>
        <p class="liters">
          18,450 liters
        </p>
        <div class="growth">
          <span class="percentage">↓ 4.2%</span>
          <p>vs last month</p>
        </div>
    </article>
    </main>
  </body>
</html>
